services:
  postgres:
    image: postgres:16-alpine
    container_name: three-tier-postgres
    environment:
      POSTGRES_DB: threetierdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: CHANGE_ME_LOCAL_ONLY
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d threetierdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: three-tier-backend
    environment:
      APP_ENV: local-docker
      DATABASE_URL: postgresql://appuser:CHANGE_ME_LOCAL_ONLY@postgres:5432/threetierdb
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: three-tier-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
