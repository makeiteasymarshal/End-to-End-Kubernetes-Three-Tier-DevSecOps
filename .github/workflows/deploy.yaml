name: CD - Build, Scan, Push to ECR & Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: three-tier-devsecops-${{ inputs.environment }}-eks
  ECR_BACKEND_REPO: three-tier-devsecops-${{ inputs.environment }}-backend
  ECR_FRONTEND_REPO: three-tier-devsecops-${{ inputs.environment }}-frontend

jobs:
  build-and-deploy:
    name: Build, Scan, Push & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Tag Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_number }}
        run: |
          docker build -f docker/backend.Dockerfile -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG .
          docker build -f docker/frontend.Dockerfile -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG .

      - name: Scan Images with Trivy before ECR Push
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}-${{ github.run_number }}-${{ github.run_number }}"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Push Images to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_number }}
        run: |
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG

      - name: Update kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install AWS Load Balancer Controller
        run: |
          VPC_ID=$(aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} --query "cluster.resourcesVpcConfig.vpcId" --output text)
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=${{ env.EKS_CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::697372770052:role/three-tier-devsecops-dev-alb-controller-role \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=$VPC_ID \
            --wait

      - name: Deploy with Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}-${{ github.run_number }}
        run: |
          helm upgrade --install three-tier-app ./helm/three-tier-app \
            --namespace three-tier-app \
            --create-namespace \
            --set backend.image.repository=$ECR_REGISTRY/$ECR_BACKEND_REPO \
            --set backend.image.tag=$IMAGE_TAG \
            --set frontend.image.repository=$ECR_REGISTRY/$ECR_FRONTEND_REPO \
            --set frontend.image.tag=$IMAGE_TAG \
            --wait --timeout 5m
